<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Complete Furnisher — J.J. Ricson (S) Pte Ltd</title>
    <meta
      name="description"
      content="The Complete Furnisher — J.J. Ricson (S) Pte Ltd"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Epilogue:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>

    <header class="site-header">
      <a class="logo" href="#top" aria-label="J.J. Ricson (S) Pte Ltd home"
        >J.J. Ricson (S) Pte Ltd</a
      >
    </header>

    <main id="main">
      <section class="hero" id="top" aria-label="Introduction">
        <div class="hero-media" aria-hidden="true">
          <img
            src="/images/hero.jpg"
            alt=""
            width="1280"
            height="960"
            fetchpriority="high"
          />
          <div class="hero-veil"></div>
        </div>
        <div class="hero-copy">
          <h1 class="company-name">J.J. Ricson (S) Pte Ltd</h1>
          <p class="brand">The Complete Furnisher</p>
        </div>
      </section>

      <section class="spaces" id="spaces" aria-label="Selected spaces">
        <div class="gallery">
          <figure class="gallery-item gallery-item--wide reveal">
            <img
              src="/images/boardroom.jpg"
              alt=""
              width="1800"
              height="1350"
              loading="lazy"
            />
          </figure>
          <figure class="gallery-item reveal">
            <img
              src="/images/kitchen-island.jpg"
              alt=""
              width="1800"
              height="1350"
              loading="lazy"
            />
          </figure>
          <figure class="gallery-item reveal">
            <img
              src="/images/kitchen.jpg"
              alt=""
              width="1600"
              height="1200"
              loading="lazy"
            />
          </figure>
          <figure class="gallery-item reveal">
            <img
              src="/images/office.jpg"
              alt=""
              width="1800"
              height="1350"
              loading="lazy"
            />
          </figure>
          <figure class="gallery-item reveal">
            <img
              src="/images/office-aisle.jpg"
              alt=""
              width="1800"
              height="1350"
              loading="lazy"
            />
          </figure>
        </div>
      </section>
    </main>

    <script src="/script.js"></script>
  </body>
</html>
